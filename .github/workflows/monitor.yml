name: VOD Monitor

on:
  schedule:
    - cron: '0 6,18 * * *' # Spustí se každý den v 6:00 a 18:00 UTC
  workflow_dispatch: # Umožňuje spustit ručně přes web GitHubu

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kódu
        uses: actions/checkout@v4

      - name: Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalace závislostí
        run: |
          pip install playwright pillow
          playwright install chromium

      - name: Spuštění monitorovacího skriptu
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python monitor.py

    - name: Uložení nových screenshotů do repozitáře
        run: |
          git config --global user.name "VOD Monitor Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add screenshots/
          git diff --staged --quiet || (git commit -m "Update screenshots [skip ci]" && git push)
